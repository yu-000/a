<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今日だけの寄せ書き</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        /* タップ時のハイライト除去 */
        button, .color-option { -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', 'Yu Gothic', sans-serif;
            background: #fdf6e3;
            min-height: 100vh;
            padding: 20px;
        }

        /* ── ヘッダー ── */
        .header {
            text-align: center;
            padding: 24px 0 28px;
        }
        .header h1 {
            font-size: 2.2rem;
            color: #333;
            letter-spacing: 0.05em;
        }
        .header h1 span { font-size: 1.8rem; }
        .timer {
            display: inline-block;
            margin-top: 10px;
            padding: 6px 18px;
            background: #fff3cd;
            border: 1px solid #f0c040;
            border-radius: 20px;
            font-size: 0.88rem;
            color: #7a5800;
        }
        #count {
            margin-top: 6px;
            font-size: 0.85rem;
            color: #999;
        }

        /* ── 投稿フォーム ── */
        .form-card {
            max-width: 580px;
            margin: 0 auto 40px;
            background: #fff;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.10);
        }
        .form-card input,
        .form-card textarea {
            width: 100%;
            padding: 11px 14px;
            border: 2px solid #e5e5e5;
            border-radius: 10px;
            font-size: 1rem;
            font-family: inherit;
            margin-bottom: 12px;
            transition: border-color 0.2s;
            background: #fafafa;
        }
        .form-card input:focus,
        .form-card textarea:focus {
            outline: none;
            border-color: #f4a261;
            background: #fff;
        }
        .form-card textarea {
            resize: vertical;
            min-height: 100px;
        }
        .char-count {
            font-size: 0.78rem;
            color: #bbb;
            text-align: right;
            margin-top: -8px;
            margin-bottom: 12px;
        }

        /* カラーピッカー */
        .color-label {
            font-size: 0.83rem;
            color: #888;
            margin-bottom: 8px;
        }
        .color-picker {
            display: flex;
            gap: 10px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }
        .color-option {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            transition: transform 0.15s, border-color 0.15s;
        }
        .color-option:hover { transform: scale(1.15); }
        .color-option.selected {
            border-color: #555;
            transform: scale(1.2);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #f4a261, #e76f51);
            color: #fff;
            border: none;
            border-radius: 50px;
            font-size: 1.05rem;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.15s;
            letter-spacing: 0.05em;
        }
        .submit-btn:hover { opacity: 0.92; transform: translateY(-1px); }
        .submit-btn:active { transform: translateY(0); }
        .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .hint {
            text-align: center;
            font-size: 0.75rem;
            color: #bbb;
            margin-top: 8px;
        }

        /* ── メッセージ一覧 ── */
        .messages-wrap {
            max-width: 1200px;
            margin: 0 auto;
        }
        .messages-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            justify-content: center;
        }

        /* 付箋スタイル */
        .card {
            width: 190px;
            min-height: 170px;
            padding: 18px 16px 28px;
            border-radius: 3px;
            box-shadow: 3px 4px 14px rgba(0,0,0,0.14);
            position: relative;
            transform: rotate(var(--rot));
            transition: transform 0.2s, box-shadow 0.2s, z-index 0s;
            cursor: default;
            word-break: break-word;
            will-change: transform;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 10px;
            background: rgba(0,0,0,0.08);
            border-radius: 0 0 4px 4px;
        }
        .card:hover {
            transform: rotate(0deg) scale(1.06);
            box-shadow: 6px 8px 24px rgba(0,0,0,0.2);
            z-index: 20;
        }
        .card .c-name {
            font-size: 0.78rem;
            font-weight: bold;
            opacity: 0.6;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card .c-text {
            font-size: 0.97rem;
            line-height: 1.6;
        }
        .card .c-time {
            position: absolute;
            bottom: 8px;
            right: 10px;
            font-size: 0.68rem;
            opacity: 0.45;
        }

        .no-messages {
            text-align: center;
            color: #aaa;
            font-size: 1.1rem;
            padding: 60px 20px;
            width: 100%;
        }

        /* 新着アニメ */
        @keyframes popIn {
            from { opacity: 0; transform: rotate(var(--rot)) scale(0.7); }
            to   { opacity: 1; transform: rotate(var(--rot)) scale(1); }
        }
        .card.new-card { animation: popIn 0.4s cubic-bezier(.17,.67,.3,1.3) forwards; }

        /* エラー */
        .error-banner {
            display: none;
            background: #fff0f0;
            border: 1px solid #f66;
            border-radius: 10px;
            padding: 14px 20px;
            margin: 0 auto 20px;
            max-width: 580px;
            font-size: 0.88rem;
            color: #c00;
            line-height: 1.6;
        }
        .error-banner a { color: #c00; }

        /* ── モバイル対応 ── */
        @media (max-width: 600px) {
            body { padding: 12px; }

            .header { padding: 16px 0 20px; }
            .header h1 { font-size: 1.5rem; }
            .timer { font-size: 0.78rem; padding: 5px 12px; }

            .form-card { padding: 16px; border-radius: 12px; margin-bottom: 24px; }

            /* iOS でフォーカス時に拡大しないよう 16px 以上に */
            .form-card input,
            .form-card textarea { font-size: 16px; }

            .color-option { width: 42px; height: 42px; }

            .submit-btn { padding: 16px; font-size: 1.1rem; }

            /* カードを2列グリッドに */
            .messages-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 12px;
                justify-items: center;
            }
            .card {
                width: 100%;
                min-height: 140px;
                transform: none !important; /* 回転なし */
                font-size: 0.9rem;
            }
            .card:active {
                transform: scale(0.97) !important;
                box-shadow: 2px 3px 10px rgba(0,0,0,0.15);
            }
            .no-messages { grid-column: 1 / -1; }
        }

        @media (max-width: 360px) {
            .header h1 { font-size: 1.3rem; }
            .messages-grid { grid-template-columns: 1fr; }
            .card { width: 100%; }
        }
    </style>
</head>
<body>

<div class="header">
    <h1><span>📝</span> 今日だけの寄せ書き</h1>
    <div class="timer" id="timer">読み込み中...</div>
    <p id="count"></p>
</div>

<div class="error-banner" id="error-banner">
    ⚠️ Firebase の設定が必要です。<br>
    <strong>index.html</strong> 内の <code>firebaseConfig</code> を
    <a href="https://console.firebase.google.com" target="_blank">Firebase Console</a>
    で作成したプロジェクトの設定値に書き換えてください。<br>
    Realtime Database のルールを <code>"read": true, "write": true</code> にしてください。
</div>

<div class="form-card">
    <input type="text" id="name-input" placeholder="お名前（任意・最大15字）" maxlength="15" />
    <textarea id="msg-input" placeholder="メッセージを書いてね…" maxlength="200"></textarea>
    <div class="char-count"><span id="char-count">0</span> / 200</div>
    <p class="color-label">付箋の色：</p>
    <div class="color-picker" id="color-picker"></div>
    <button class="submit-btn" id="submit-btn" onclick="submitMsg()">投稿する ✏️</button>
    <p class="hint">0:00 になるとメッセージが消えます（PCは Ctrl+Enter で投稿）</p>
</div>

<div class="messages-wrap">
    <div class="messages-grid" id="messages-grid">
        <div class="no-messages">読み込み中…</div>
    </div>
</div>

<!-- ============================================================
     🔧 Firebase 設定方法
     1. https://console.firebase.google.com でプロジェクト作成
     2. 「Realtime Database」を有効化（テストモードで OK）
     3. プロジェクトの設定 → ウェブアプリを追加 → 設定値をコピー
     4. 下の firebaseConfig を書き換えてください
     ============================================================ -->
<script type="module">
    import { initializeApp }  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getDatabase, ref, push, onValue } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

    const firebaseConfig = {
        apiKey:            "AIzaSyAYInw3toiMgf7gbLa81gNvdwgXHpD25SU",
        authDomain:        "tekist-55518.firebaseapp.com",
        databaseURL:       "https://tekist-55518-default-rtdb.firebaseio.com",
        projectId:         "tekist-55518",
        storageBucket:     "tekist-55518.firebasestorage.app",
        messagingSenderId: "1094877502738",
        appId:             "1:1094877502738:web:13a968e89a4b99f90167cb"
    };

    // 設定が未入力の場合はエラーバナーを表示
    if (firebaseConfig.apiKey === "YOUR_API_KEY") {
        document.getElementById('error-banner').style.display = 'block';
        document.getElementById('messages-grid').innerHTML =
            '<div class="no-messages">Firebase の設定を完了すると使えます</div>';
        document.getElementById('submit-btn').disabled = true;
    }

    let db, messagesRef;
    try {
        const app = initializeApp(firebaseConfig);
        db = getDatabase(app);
    } catch(e) {
        console.error('Firebase init error:', e);
    }

    // 今日の日付をルームキーに使用（0時でリセット）
    function todayKey() {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    if (db) {
        messagesRef = ref(db, `yosegaki/${todayKey()}`);
        setupListener();
    }

    // ── カラーパレット ──
    const COLORS = [
        { bg: '#fff9a3', label: '黄色' },
        { bg: '#ffd6e0', label: 'ピンク' },
        { bg: '#b5ead7', label: '緑' },
        { bg: '#c4deff', label: '水色' },
        { bg: '#ffd8a8', label: 'オレンジ' },
        { bg: '#e8d5ff', label: '紫' },
        { bg: '#ffffff', label: '白' },
    ];
    let selectedBg = COLORS[0].bg;

    const picker = document.getElementById('color-picker');
    COLORS.forEach((c, i) => {
        const el = document.createElement('div');
        el.className = 'color-option' + (i === 0 ? ' selected' : '');
        el.style.background = c.bg;
        el.style.boxShadow = '0 1px 4px rgba(0,0,0,0.15)';
        el.title = c.label;
        el.onclick = () => {
            picker.querySelectorAll('.color-option').forEach(x => x.classList.remove('selected'));
            el.classList.add('selected');
            selectedBg = c.bg;
        };
        picker.appendChild(el);
    });

    // ── 文字数カウント ──
    document.getElementById('msg-input').addEventListener('input', function() {
        document.getElementById('char-count').textContent = this.value.length;
    });

    // ── Ctrl+Enter で投稿 ──
    document.getElementById('msg-input').addEventListener('keydown', e => {
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) submitMsg();
    });

    // ── カウントダウン ──
    function updateTimer() {
        const now = new Date();
        const midnight = new Date(now);
        midnight.setHours(24, 0, 0, 0);
        const diff = midnight - now;
        const h = Math.floor(diff / 3600000);
        const m = Math.floor((diff % 3600000) / 60000);
        const s = Math.floor((diff % 60000) / 1000);
        document.getElementById('timer').textContent =
            `0時になるとメッセージが消えます ⏳ あと ${h}時間${m}分${s}秒`;
        // 日付が変わったらリロード
        if (diff <= 0) location.reload();
    }
    setInterval(updateTimer, 1000);
    updateTimer();

    // ── リアルタイム受信 ──
    let knownIds = new Set();

    function setupListener() {
        onValue(messagesRef, snapshot => {
            const data = snapshot.val();
            const grid = document.getElementById('messages-grid');

            if (!data) {
                grid.innerHTML = '<div class="no-messages">まだメッセージがありません。<br>最初の一言を書いてみましょう！ ✍️</div>';
                document.getElementById('count').textContent = '';
                knownIds.clear();
                return;
            }

            const entries = Object.entries(data)
                .map(([id, v]) => ({ id, ...v }))
                .sort((a, b) => a.ts - b.ts);

            document.getElementById('count').textContent = `${entries.length} 件のメッセージ`;

            // 差分追加（全再描画しない）
            const newIds = new Set(entries.map(e => e.id));
            if (knownIds.size === 0) {
                // 初回: 全描画
                grid.innerHTML = '';
                entries.forEach(msg => grid.appendChild(makeCard(msg, false)));
            } else {
                entries.forEach(msg => {
                    if (!knownIds.has(msg.id)) {
                        grid.appendChild(makeCard(msg, true));
                    }
                });
            }
            knownIds = newIds;
        }, err => {
            console.error(err);
            document.getElementById('error-banner').style.display = 'block';
        });
    }

    function makeCard(msg, isNew) {
        const card = document.createElement('div');
        card.className = 'card' + (isNew ? ' new-card' : '');
        const rot = ((msg.ts % 100) / 100 * 8 - 4).toFixed(1); // -4 ~ +4 deg
        card.style.setProperty('--rot', `${rot}deg`);
        card.style.background = msg.color || '#fff9a3';

        const t = new Date(msg.ts);
        const time = `${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`;

        card.innerHTML = `
            <div class="c-name">${esc(msg.name || '名無しさん')}</div>
            <div class="c-text">${esc(msg.text).replace(/\n/g, '<br>')}</div>
            <div class="c-time">${time}</div>
        `;
        return card;
    }

    function esc(s) {
        return String(s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    // ── 投稿 ──
    window.submitMsg = async function() {
        if (!db) return;
        const nameEl = document.getElementById('name-input');
        const msgEl  = document.getElementById('msg-input');
        const btn    = document.getElementById('submit-btn');
        const text   = msgEl.value.trim();
        if (!text) { msgEl.focus(); return; }

        btn.disabled = true;
        btn.textContent = '投稿中…';
        try {
            await push(messagesRef, {
                name:  nameEl.value.trim() || '名無しさん',
                text:  text,
                color: selectedBg,
                ts:    Date.now()
            });
            msgEl.value = '';
            document.getElementById('char-count').textContent = '0';
        } catch(e) {
            alert('投稿に失敗しました。Firebase の設定を確認してください。\n' + e.message);
        } finally {
            btn.disabled = false;
            btn.textContent = '投稿する ✏️';
        }
    };
</script>
</body>
</html>
